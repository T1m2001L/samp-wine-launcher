# DXVK configuration — the vsync line below is CRITICAL.
#
# Without presentInterval=0, DXVK picks VK_PRESENT_MODE_FIFO_KHR. In a headless
# Xorg (Xorg + HDMI dummy plug, no real monitor) that present call blocks
# forever: the window stays on frame 0 — it looks frozen at ~1 fps and the game
# never gets past its loading screen. Disabling vsync fixes it completely.
d3d9.presentInterval = 0
d3d9.maxFrameLatency  = 0
dxgi.syncInterval     = 0
dxgi.maxFrameRate     = -1
d3d9.maxFrameRate     = -1
